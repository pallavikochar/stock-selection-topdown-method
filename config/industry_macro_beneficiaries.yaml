# Industry-level macro beneficiary lookup.
# Source: Piper Sandler Field Guide's three ranked lists.
# TUNABLE: Add/remove industries as your coverage universe changes.
# growth_beneficiary: high PMI correlation (outperform when PMI rises)
# inflation_beneficiary: high CPI/commodity correlation (outperform when inflation rises)
# risk_on_beneficiary: negative BAA spread correlation (outperform when spreads tighten)
# risk_off_beneficiary: positive BAA spread correlation (outperform when spreads widen)

